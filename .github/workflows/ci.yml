name: CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint:check

      - name: Check formatting
        run: bun x prettier --check "src/**/*.{js,jsx,ts,tsx,astro,json,css,scss,md}"

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: github.event_name == 'push'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Browsers
        run: bun x playwright install --with-deps chromium

      - name: Run E2E tests
        run: |
          bun run test:e2e --project=chromium
          bun run test:e2e:dev-server

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  build:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run build

      - name: Check for build artifacts
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi
          echo "Build successful: dist directory exists"

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run build

      - name: Serve site
        run: |
          bun run preview &
          sleep 5
          curl -I http://localhost:4321/es/ || exit 1

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:4321/es/
            http://localhost:4321/en/
            http://localhost:4321/es/acerca-de/
            http://localhost:4321/en/about/
          uploadArtifacts: false
          temporaryPublicStorage: true
          runs: 3

  # Post-merge regression check. Runs on pushes to master. The PR-gate
  # counterpart is `audit-pr-gate` below: that one compares the PR's
  # audit output against the base branch, so a PR is not blocked by
  # vulnerabilities already living in master. This job enforces the
  # hard policy: master itself must not introduce new high or critical
  # vulnerabilities. See docs/security/audit-policy.md.
  audit:
    name: Dependency Audit (post-merge)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    # Strict: fail on any high or critical vulnerability present on
    # master. Moderate and low are reported in the log but do not
    # block. Dependabot security updates remain the canonical path
    # to fix them.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run bun audit
        run: bun audit --audit-level=high

  # PR-gate: fail only if the PR introduces new high or critical
  # advisories. Pre-existing advisories on the base branch are not
  # the PR's responsibility and are reported in the log for context.
  # See docs/security/audit-policy.md for the full rationale.
  audit-pr-gate:
    name: Dependency Audit (PR-gate)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Run bun audit on PR head
        id: head-audit
        run: |
          bun install --frozen-lockfile
          # `bun audit --json` exits 1 whenever vulnerabilities are
          # found, regardless of --audit-level. The exit code is
          # therefore useless as a step-level signal: the diff
          # script is the source of truth for pass/fail. We capture
          # the exit code for logging and ignore it here.
          set +e
          bun audit --json --audit-level=low > /tmp/head-audit.json
          AUDIT_EXIT=$?
          set -e
          if [ ! -s /tmp/head-audit.json ]; then
            echo "::error::head-audit.json is empty or missing"
            exit 1
          fi
          echo "bun audit exit code: $AUDIT_EXIT (ignored; see diff step for decision)"
        env:
          # Suppress bun's own log lines so the JSON file is clean.
          BUN_AUDIT_QUIET: 1

      - name: Run bun audit on base branch
        id: base-audit
        run: |
          # Materialise base's bun.lock into a temp directory without
          # touching the working copy. We use `git show` to extract
          # the file from the base ref and install it isolated.
          BASE_REF="origin/${{ github.base_ref }}"
          git rev-parse --verify "$BASE_REF" >/dev/null || {
            echo "::error::Base ref $BASE_REF not found"
            exit 1
          }
          mkdir -p /tmp/base-audit
          # Use the base ref's package.json AND bun.lock together.
          # Mixing the PR head's package.json with the base's bun.lock
          # produces a "lockfile had changes, but lockfile is frozen"
          # error because the resolved versions drift.
          git show "$BASE_REF:package.json" > /tmp/base-audit/package.json
          git show "$BASE_REF:bun.lock" > /tmp/base-audit/bun.lock
          cd /tmp/base-audit
          bun install --frozen-lockfile
          # Same exit-code handling as the head step: bun audit's
          # exit code reflects "vulnerabilities found", not "audit
          # ran successfully". The JSON is what we care about.
          set +e
          bun audit --json --audit-level=low > /tmp/base-audit.json
          AUDIT_EXIT=$?
          set -e
          if [ ! -s /tmp/base-audit.json ]; then
            echo "::error::base-audit.json is empty or missing"
            exit 1
          fi
          echo "bun audit exit code: $AUDIT_EXIT (ignored; see diff step for decision)"
        env:
          BUN_AUDIT_QUIET: 1

      - name: Compute diff and decide
        run: bun run scripts/audit-pr-gate.ts /tmp/base-audit.json /tmp/head-audit.json
